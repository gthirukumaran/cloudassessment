<svg width="1400" height="1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 24px; font-weight: bold; fill: #2c3e50; }
      .subtitle { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #34495e; }
      .text { font-family: Arial, sans-serif; font-size: 12px; fill: #2c3e50; }
      .small-text { font-family: Arial, sans-serif; font-size: 10px; fill: #7f8c8d; }
      .layer-bg { fill: #ecf0f1; stroke: #bdc3c7; stroke-width: 2; }
      .component { fill: #3498db; stroke: #2980b9; stroke-width: 2; rx: 8; ry: 8; }
      .service { fill: #e74c3c; stroke: #c0392b; stroke-width: 2; rx: 8; ry: 8; }
      .database { fill: #f39c12; stroke: #e67e22; stroke-width: 2; rx: 8; ry: 8; }
      .external { fill: #9b59b6; stroke: #8e44ad; stroke-width: 2; rx: 8; ry: 8; }
      .flow-arrow { stroke: #2c3e50; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .data-flow { stroke: #e74c3c; stroke-width: 2; fill: none; stroke-dasharray: 5,5; marker-end: url(#arrowhead-red); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50" />
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c" />
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="700" y="30" text-anchor="middle" class="title">SecurityA - Cloud Security Assessment Platform</text>
  <text x="700" y="55" text-anchor="middle" class="subtitle">System Architecture & Workflow Diagram</text>
  
  <!-- User Layer -->
  <rect x="50" y="80" width="1300" height="80" class="layer-bg"/>
  <text x="70" y="105" class="subtitle">User Layer</text>
  <rect x="200" y="100" width="120" height="40" class="component"/>
  <text x="260" y="125" text-anchor="middle" class="text">Security Admin</text>
  <rect x="400" y="100" width="120" height="40" class="component"/>
  <text x="460" y="125" text-anchor="middle" class="text">DevOps Engineer</text>
  <rect x="600" y="100" width="120" height="40" class="component"/>
  <text x="660" y="125" text-anchor="middle" class="text">Compliance Officer</text>
  
  <!-- Presentation Layer -->
  <rect x="50" y="180" width="1300" height="120" class="layer-bg"/>
  <text x="70" y="205" class="subtitle">Presentation Layer (React Frontend)</text>
  <rect x="100" y="220" width="100" height="60" class="component"/>
  <text x="150" y="240" text-anchor="middle" class="text">Login Page</text>
  <text x="150" y="255" text-anchor="middle" class="small-text">Azure OAuth2</text>
  
  <rect x="220" y="220" width="100" height="60" class="component"/>
  <text x="270" y="240" text-anchor="middle" class="text">Dashboard</text>
  <text x="270" y="255" text-anchor="middle" class="small-text">Risk Overview</text>
  
  <rect x="340" y="220" width="100" height="60" class="component"/>
  <text x="390" y="240" text-anchor="middle" class="text">Scans Page</text>
  <text x="390" y="255" text-anchor="middle" class="small-text">Scan Management</text>
  
  <rect x="460" y="220" width="100" height="60" class="component"/>
  <text x="510" y="240" text-anchor="middle" class="text">Scan Details</text>
  <text x="510" y="255" text-anchor="middle" class="small-text">Findings View</text>
  
  <rect x="580" y="220" width="100" height="60" class="component"/>
  <text x="630" y="240" text-anchor="middle" class="text">Reports Page</text>
  <text x="630" y="255" text-anchor="middle" class="small-text">PDF Generation</text>
  
  <rect x="700" y="220" width="100" height="60" class="component"/>
  <text x="750" y="240" text-anchor="middle" class="text">Chatbot</text>
  <text x="750" y="255" text-anchor="middle" class="small-text">AI Assistant</text>
  
  <rect x="820" y="220" width="100" height="60" class="component"/>
  <text x="870" y="240" text-anchor="middle" class="text">Settings</text>
  <text x="870" y="255" text-anchor="middle" class="small-text">User Preferences</text>
  
  <!-- API Gateway Layer -->
  <rect x="50" y="320" width="1300" height="80" class="layer-bg"/>
  <text x="70" y="345" class="subtitle">API Gateway Layer (FastAPI)</text>
  <rect x="200" y="340" width="150" height="40" class="service"/>
  <text x="275" y="365" text-anchor="middle" class="text">Authentication Service</text>
  
  <rect x="400" y="340" width="150" height="40" class="service"/>
  <text x="475" y="365" text-anchor="middle" class="text">Scan Management API</text>
  
  <rect x="600" y="340" width="150" height="40" class="service"/>
  <text x="675" y="365" text-anchor="middle" class="text">AI Analysis API</text>
  
  <rect x="800" y="340" width="150" height="40" class="service"/>
  <text x="875" y="365" text-anchor="middle" class="text">Report Generation API</text>
  
  <!-- Business Logic Layer -->
  <rect x="50" y="420" width="1300" height="120" class="layer-bg"/>
  <text x="70" y="445" class="subtitle">Business Logic Layer (Microservices)</text>
  
  <rect x="80" y="460" width="120" height="60" class="service"/>
  <text x="140" y="480" text-anchor="middle" class="text">Auth Service</text>
  <text x="140" y="495" text-anchor="middle" class="small-text">JWT Management</text>
  
  <rect x="220" y="460" width="120" height="60" class="service"/>
  <text x="280" y="480" text-anchor="middle" class="text">Scan Engine</text>
  <text x="280" y="495" text-anchor="middle" class="small-text">Azure Resource Scan</text>
  
  <rect x="360" y="460" width="120" height="60" class="service"/>
  <text x="420" y="480" text-anchor="middle" class="text">AI Analysis</text>
  <text x="420" y="495" text-anchor="middle" class="small-text">OpenAI GPT-3.5</text>
  
  <rect x="500" y="460" width="120" height="60" class="service"/>
  <text x="560" y="480" text-anchor="middle" class="text">Report Generator</text>
  <text x="560" y="495" text-anchor="middle" class="small-text">PDF/Excel Export</text>
  
  <rect x="640" y="460" width="120" height="60" class="service"/>
  <text x="700" y="480" text-anchor="middle" class="text">Chatbot Service</text>
  <text x="700" y="495" text-anchor="middle" class="small-text">Context-Aware AI</text>
  
  <rect x="780" y="460" width="120" height="60" class="service"/>
  <text x="840" y="480" text-anchor="middle" class="text">Notification</text>
  <text x="840" y="495" text-anchor="middle" class="small-text">Email/Alerts</text>
  
  <rect x="920" y="460" width="120" height="60" class="service"/>
  <text x="980" y="480" text-anchor="middle" class="text">Task Queue</text>
  <text x="980" y="495" text-anchor="middle" class="small-text">Celery/Redis</text>
  
  <!-- Data Access Layer -->
  <rect x="50" y="560" width="1300" height="100" class="layer-bg"/>
  <text x="70" y="585" class="subtitle">Data Access Layer</text>
  
  <rect x="150" y="600" width="120" height="40" class="database"/>
  <text x="210" y="625" text-anchor="middle" class="text">PostgreSQL</text>
  
  <rect x="300" y="600" width="120" height="40" class="database"/>
  <text x="360" y="625" text-anchor="middle" class="text">Redis Cache</text>
  
  <rect x="450" y="600" width="120" height="40" class="database"/>
  <text x="510" y="625" text-anchor="middle" class="text">File Storage</text>
  
  <rect x="600" y="600" width="120" height="40" class="database"/>
  <text x="660" y="625" text-anchor="middle" class="text">Session Store</text>
  
  <!-- External Services Layer -->
  <rect x="50" y="680" width="1300" height="100" class="layer-bg"/>
  <text x="70" y="705" class="subtitle">External Services</text>
  
  <rect x="100" y="720" width="120" height="40" class="external"/>
  <text x="160" y="745" text-anchor="middle" class="text">Azure AD</text>
  
  <rect x="250" y="720" width="120" height="40" class="external"/>
  <text x="310" y="745" text-anchor="middle" class="text">Azure APIs</text>
  
  <rect x="400" y="720" width="120" height="40" class="external"/>
  <text x="460" y="745" text-anchor="middle" class="text">OpenAI API</text>
  
  <rect x="550" y="720" width="120" height="40" class="external"/>
  <text x="610" y="745" text-anchor="middle" class="text">Email Service</text>
  
  <rect x="700" y="720" width="120" height="40" class="external"/>
  <text x="760" y="745" text-anchor="middle" class="text">Monitoring</text>
  
  <!-- Workflow Arrows -->
  <!-- User to Frontend -->
  <line x1="260" y1="140" x2="260" y2="220" class="flow-arrow"/>
  <line x1="460" y1="140" x2="460" y2="220" class="flow-arrow"/>
  <line x1="660" y1="140" x2="660" y2="220" class="flow-arrow"/>
  
  <!-- Frontend to API Gateway -->
  <line x1="275" y1="280" x2="275" y2="340" class="flow-arrow"/>
  <line x1="475" y1="280" x2="475" y2="340" class="flow-arrow"/>
  <line x1="675" y1="280" x2="675" y2="340" class="flow-arrow"/>
  <line x1="875" y1="280" x2="875" y2="340" class="flow-arrow"/>
  
  <!-- API Gateway to Business Logic -->
  <line x1="275" y1="380" x2="140" y2="460" class="flow-arrow"/>
  <line x1="475" y1="380" x2="280" y2="460" class="flow-arrow"/>
  <line x1="675" y1="380" x2="420" y2="460" class="flow-arrow"/>
  <line x1="875" y1="380" x2="560" y2="460" class="flow-arrow"/>
  
  <!-- Business Logic to Data Layer -->
  <line x1="210" y1="520" x2="210" y2="600" class="flow-arrow"/>
  <line x1="360" y1="520" x2="360" y2="600" class="flow-arrow"/>
  <line x1="510" y1="520" x2="510" y2="600" class="flow-arrow"/>
  <line x1="660" y1="520" x2="660" y2="600" class="flow-arrow"/>
  
  <!-- Business Logic to External Services -->
  <line x1="140" y1="520" x2="160" y2="720" class="data-flow"/>
  <line x1="280" y1="520" x2="310" y2="720" class="data-flow"/>
  <line x1="420" y1="520" x2="460" y2="720" class="data-flow"/>
  <line x1="840" y1="520" x2="610" y2="720" class="data-flow"/>
  
  <!-- Legend -->
  <rect x="1050" y="100" width="280" height="180" fill="#ffffff" stroke="#bdc3c7" stroke-width="1" rx="5"/>
  <text x="1060" y="120" class="subtitle">Legend</text>
  
  <rect x="1060" y="130" width="20" height="15" class="component"/>
  <text x="1090" y="142" class="small-text">Frontend Components</text>
  
  <rect x="1060" y="150" width="20" height="15" class="service"/>
  <text x="1090" y="162" class="small-text">Backend Services</text>
  
  <rect x="1060" y="170" width="20" height="15" class="database"/>
  <text x="1090" y="182" class="small-text">Data Storage</text>
  
  <rect x="1060" y="190" width="20" height="15" class="external"/>
  <text x="1090" y="202" class="small-text">External Services</text>
  
  <line x1="1060" y1="215" x2="1080" y2="215" class="flow-arrow"/>
  <text x="1090" y="220" class="small-text">API Calls</text>
  
  <line x1="1060" y1="235" x2="1080" y2="235" class="data-flow"/>
  <text x="1090" y="240" class="small-text">External Integration</text>
  
  <!-- Key Features Box -->
  <rect x="1050" y="300" width="280" height="200" fill="#ffffff" stroke="#bdc3c7" stroke-width="1" rx="5"/>
  <text x="1060" y="320" class="subtitle">Key Features</text>
  <text x="1060" y="340" class="small-text">• Azure OAuth2 Authentication</text>
  <text x="1060" y="355" class="small-text">• Real-time Security Scanning</text>
  <text x="1060" y="370" class="small-text">• AI-Powered Risk Analysis</text>
  <text x="1060" y="385" class="small-text">• Automated Report Generation</text>
  <text x="1060" y="400" class="small-text">• Interactive AI Chatbot</text>
  <text x="1060" y="415" class="small-text">• Multi-tenant Architecture</text>
  <text x="1060" y="430" class="small-text">• RESTful API Design</text>
  <text x="1060" y="445" class="small-text">• Microservices Pattern</text>
  <text x="1060" y="460" class="small-text">• Event-Driven Architecture</text>
  <text x="1060" y="475" class="small-text">• Scalable Cloud Infrastructure</text>
  
  <!-- Workflow Steps -->
  <rect x="1050" y="520" width="280" height="220" fill="#ffffff" stroke="#bdc3c7" stroke-width="1" rx="5"/>
  <text x="1060" y="540" class="subtitle">Typical User Workflow</text>
  <text x="1060" y="560" class="small-text">1. User logs in via Azure AD</text>
  <text x="1060" y="575" class="small-text">2. Dashboard shows security overview</text>
  <text x="1060" y="590" class="small-text">3. User initiates new security scan</text>
  <text x="1060" y="605" class="small-text">4. Scan engine analyzes Azure resources</text>
  <text x="1060" y="620" class="small-text">5. AI analyzes findings for risk assessment</text>
  <text x="1060" y="635" class="small-text">6. Results displayed with recommendations</text>
  <text x="1060" y="650" class="small-text">7. User generates compliance reports</text>
  <text x="1060" y="665" class="small-text">8. AI chatbot provides contextual help</text>
  <text x="1060" y="680" class="small-text">9. Notifications sent for critical issues</text>
  <text x="1060" y="695" class="small-text">10. Historical data tracked for trends</text>
  
  <!-- Technology Stack -->
  <rect x="1050" y="760" width="280" height="180" fill="#ffffff" stroke="#bdc3c7" stroke-width="1" rx="5"/>
  <text x="1060" y="780" class="subtitle">Technology Stack</text>
  <text x="1060" y="800" class="small-text">Frontend: React, TypeScript, Material-UI</text>
  <text x="1060" y="815" class="small-text">Backend: FastAPI, Python, SQLAlchemy</text>
  <text x="1060" y="830" class="small-text">Database: PostgreSQL, Redis</text>
  <text x="1060" y="845" class="small-text">AI: OpenAI GPT-3.5, LangChain</text>
  <text x="1060" y="860" class="small-text">Cloud: Azure (AD, APIs, Storage)</text>
  <text x="1060" y="875" class="small-text">Queue: Celery, Redis</text>
  <text x="1060" y="890" class="small-text">Reports: ReportLab, WeasyPrint</text>
  <text x="1060" y="905" class="small-text">Monitoring: Prometheus, Structlog</text>
  
</svg>